# LLM 配置（OpenAI 兼容协议）
# 现行：火山方舟 ark + doubao-seed-evolving
# 密钥放仓库根 .env：ARK_API_KEY=...
llm:
  default_provider: "ark"
  custom_providers:
    ark:
      base_url: "https://ark.cn-beijing.volces.com/api/v3"
      api_key: "${ARK_API_KEY}"
      models:
        fast: "doubao-seed-evolving"
        strong: "doubao-seed-evolving"
  model_routing:
    conversation: "ark:fast"
    narrative: "ark:strong"
    consciousness: "ark:fast"
    dream: "ark:fast"
    creation: "ark:fast"
    reflection: "ark:strong"
    fact: "ark:fast"
    look: "ark:fast"

# 心跳配置
rhythm:
  awake_interval: 3
  ambient_interval: 30
  solitary_interval: 300
  dreaming_interval: 1800

# 数据库配置
database:
  path: "data/qi.db"

# 情绪配置
emotion:
  decay_multiplier: 1.0
  expression_threshold: 0.3

# 记忆配置
memory:
  max_working_memory: 20
  narrative_weave_interval: 21600          # 无积压时编织周期（秒）
  narrative_weave_backlog_threshold: 8     # 未编织 ≥ 此数则改用短周期
  narrative_weave_backlog_interval: 900    # 积压时编织周期（秒）
  narrative_weave_check_period: 3600        # 长睡眠中途复查积压的粒度（秒）
  narrative_weave_batch_size: 10           # 每次最多织多少条 raw_events
  decay_interval: 86400
  chroma_path: "data/chroma"
  dream_retention_hours: 6

# 内在生命
inner_life:
  consciousness_probability: 0.05
  ambient_drift_factor: 0.2          # ambient 走神 = probability × 此系数；再加 stream 冷却
  stream_cooldown_minutes: 45        # 非事件型 stream 最小间隔（留白）
  dream_consolidation_probability: 0.3   # 有未巩固 episode 时做梦概率（决策内生）
  # dream_probability: 0.1               # 已废弃：旧 10%/拍，勿再使用
  creation_probability: 0.01
  meta_cognition_probability: 0.01
  self_reflection_interval: 604800

# 主动行为冷却（秒）
proactive_cooldown:
  check_in: 14400
  reach_out: 28800
  share_creation: 86400
  express_feeling: 7200

# 全局工作空间（阶段二·补丁 C）：默认启用仲裁分发；legacy 保留回滚
gws:
  enabled: true
  shadow_beats: 50
  shadow_match_min: 0.99

# 行动层（L7）：自主行动日限（远高真实触发上限，仅作安全阀）
action:
  autonomous_daily_limit: 20
  share_cooldown_hours: 2       # 递出后冷却（默认 2h，与 explore_external 对称）
  season_scale:
    spring: 1.0
    summer: 0.8
    autumn: 0.5
    winter: 0.2
  # explore 外部联网（d-1）：默认关；配齐 key 后本机 settings 开 enabled
  # 不设独立 external daily_limit——复用 ActionBudget 日限 20；
  # 外部稀有靠 curiosity≥0.8 + 冷却6h + 概率0.05
  explore_external:
    enabled: false
    provider: tavily
    api_key: "${TAVILY_API_KEY}"
    cooldown_hours: 6
    probability: 0.05
    # 可选域名过滤（默认空=不改变 Tavily 现状；嫌噪声可加如 music.apple.com / mojim.com）
    exclude_domains: []
    # 委托检索 P0/P2：多轮/时效/深读（自主 explore 仍用默认 basic×3）
    delegate_top_k: 5
    delegate_search_depth: basic
    delegate_time_range: month
    delegate_deep_read: true
    delegate_deep_read_max: 2
  # look 窗口瞥视（感知从宽；非定时）
  look:
    pause_hours: 1              # 「别看」暂停时长
    min_interval_minutes: 30    # 自主防连瞥硬门（邀看不受限；事不过三不可破此间隔）
    chat_grace_minutes: 5       # 刚聊完不久不自主瞥（开发连发时减噪）
    silence_boost_minutes: 20   # 沉默多久开始提高自主 look 倾向
  open:
    debounce_seconds: 8         # 同一目标确认后短时防连开
    look_after_delay_seconds: 1.2  # open_and_look 打开后再瞥前等待


# 关系
relationship:
  culture_detection_interval: 86400
  season_detection_interval: 86400
  scar_healing_interval: 86400
  drift_detection_interval: 259200
  daily_depth_cap: 0.03

# 语音（默认关闭；开启后说话会带 TTS）
voice:
  enabled: false
  provider: "edge-tts"
  voice_id: "zh-CN-XiaoyiNeural"
  auto_play: true

# 具身通道（仅 loopback；非 127.0.0.1/localhost/::1 会被强制回退）
embodiment:
  host: "127.0.0.1"
  port: 9527

# 内稳态 / 资源账本（阶段四；第 3 批标定）
stasis:
  starve_beats: 45
  interaction_income: 25.0       # 有效交互单次收入
  presence_income: 2.0           # 在场钝感收入
  presence_min_interval_sec: 30  # 在场入账最短间隔
  pressure_sensitivity: 1.0
