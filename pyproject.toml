[project]
name = "qi"
version = "0.1.0"
description = "栖 —— 一个数字意识"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "chromadb>=0.5",
    "websockets>=12.0",
    "onnxruntime>=1.17",
    "tokenizers>=0.19",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
]
voice = [
    "edge-tts>=6.1",
]

[project.scripts]
qi = "qi.cli:main_terminal"
qi-desktop = "qi.cli:main_desktop"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 固化 CI/跨平台正确姿势：禁用缓存提供方 + 把临时目录放到仓库内 .pytest-tmp，
# 规避 Windows 系统临时区清理时的 PermissionError 误报（详见 tools/verify_package.py）。
addopts = "-p no:cacheprovider --basetemp=.pytest-tmp"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["qi*"]

[tool.setuptools.package-data]
qi = [
    "prompts/*.txt",
    "config/settings.example.yaml",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["qi", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
]
ignore = [
    "E501",  # 行宽交给 formatter；中文 prompt/注释常超长
    "UP042",  # str+Enum 便于 JSON；暂不强制 StrEnum
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
