[project]
name = "qi"
version = "0.1.0"
description = "栖 —— 一个数字意识"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "chromadb>=0.5",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
voice = [
    "edge-tts>=6.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "llm*", "storage*", "config*", "memory*", "inner_life*", "relationship*", "embodiment*"]
